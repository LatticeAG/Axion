name = "axion"
main = "src/proxy/index.ts"
compatibility_date = "2024-06-01"
compatibility_flags = ["nodejs_compat"]

# Durable Object binding for per-session belief timeline state.
[[durable_objects.bindings]]
name = "SESSION"
class_name = "SessionDurableObject"

# Global index used to browse, search, and report on all session metadata.
[[durable_objects.bindings]]
name = "SESSION_REGISTRY"
class_name = "SessionRegistryDurableObject"

# Initial migration for the per-session timeline Durable Object.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionDurableObject"]

# Adds the global metadata registry without remapping existing session objects.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["SessionRegistryDurableObject"]

# Static assets for the dashboard (served by the Worker via the ASSETS binding).
# Worker-first so /dashboard routing and the read APIs own the origin.
[assets]
directory = "./src/dashboard"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

# Vars / secrets:
#   UPSTREAM_OPENAI_URL     - OpenAI adapter base (default https://api.openai.com)
#   UPSTREAM_ANTHROPIC_URL  - Anthropic adapter base (default https://api.anthropic.com)
#   UPSTREAM_API_URL        - legacy OpenAI-only override when UPSTREAM_OPENAI_URL is unset
#   UPSTREAM_API_KEY        - optional; only used when the caller does not send
#                             Authorization / x-api-key. Prefer caller passthrough.
#                             Set with: wrangler secret put UPSTREAM_API_KEY
#   AXION_READ_TOKEN        - required for every public read API in production
#                             wrangler secret put AXION_READ_TOKEN
#   AXION_OPEN_READ         - local escape; must be the string "true". Do not set in production.
#   AXION_CORS_ORIGIN       - exact Origin to reflect; unset means no CORS headers
#   AXION_CURSOR_SECRET     - HMAC for /api/search cursors (wrangler secret put)
#   AXION_BELIEF_WEBHOOK_URL - POST axion.belief_batch.v1 after a successful store
#   AXION_WEBHOOK_SECRET    - HMAC for belief-batch webhooks (wrangler secret put)
#   AXION_WEBHOOK_ALLOW_UNSIGNED - local only; allow unsigned webhook POSTs
#                       Local: copy .dev.vars.example → .dev.vars
[vars]
UPSTREAM_API_URL = "https://api.openai.com"
